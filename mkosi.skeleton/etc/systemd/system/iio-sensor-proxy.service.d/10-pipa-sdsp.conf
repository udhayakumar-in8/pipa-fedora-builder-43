# On pipa the accelerometer is behind the SDSP sensor hub (libssc), not a
# plain IIO device. If iio-sensor-proxy starts before hexagonrpcd-sdsp has
# brought the hub up it finds nothing and reports "No accelerometer".
[Unit]
Wants=hexagonrpcd-sdsp.service
After=hexagonrpcd-sdsp.service

[Service]
ExecStartPre=/usr/bin/sleep 5
# with the hub gone it hangs on stop; don't wait the default 90s
TimeoutStopSec=3
