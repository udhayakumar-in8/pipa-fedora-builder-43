# Ubuntu Router image - default build configuration.
#
# Do not edit this file for local changes: copy the settings you want to
# change into config/local.conf (git-ignored, loaded after this file) or
# pass your own file with `build.sh -c my.conf`.

# --- Distribution -----------------------------------------------------------
SUITE="jammy"                                   # Ubuntu 22.04 LTS
ARCH="amd64"
MIRROR="http://archive.ubuntu.com/ubuntu"
SECURITY_MIRROR="http://security.ubuntu.com/ubuntu"
COMPONENTS="main restricted universe"

# Kernel: HWE (6.8) has much better support for recent NICs (i225/i226, ...).
# Use "linux-image-generic" for the 5.15 GA kernel.
KERNEL_PACKAGE="linux-image-generic-hwe-22.04"

# --- Image ------------------------------------------------------------------
IMAGE_NAME="ubuntu-router"
VERSION=""                                      # empty = date based (YYYY.MM.DD-HHMM)
OUTPUT_DIR="out"
COMPRESS="zstd"                                 # zstd | xz | none

# Package profiles, each one is packages/<name>.list. custom.list is always added.
PROFILES="base router"
EXTRA_PACKAGES=""                               # space separated, e.g. "htop mtr-tiny"

# --- Partition layout (MiB) -------------------------------------------------
# GPT: 1 bios_boot (1M) | 2 ESP /boot/efi | 3 /boot | 4 / | 5 /var
# /var is the last partition: flash.sh grows it to fill the target disk.
ESP_SIZE=256
BOOT_SIZE=1024
ROOT_SIZE=4096
VAR_SIZE=1024

# --- System -----------------------------------------------------------------
HOSTNAME="router"
DOMAIN="lan"
TIMEZONE="UTC"
LOCALE="en_US.UTF-8"
KEYMAP="us"

# Kernel command line. net.ifnames=0 gives stable eth0/eth1/... names on any
# hardware, the serial console lets you manage headless boxes.
KERNEL_CMDLINE="net.ifnames=0 biosdevname=0 console=tty0 console=ttyS0,115200n8"
GRUB_TIMEOUT=3

# --- Admin account ----------------------------------------------------------
# Root is locked. The admin user is in the sudo + sshusers groups.
ADMIN_USER="admin"
ADMIN_SSH_KEY=""        # path to a public key file; when set SSH password login is disabled
ADMIN_PASSWORD=""       # empty = random password, written to <output>/<image>.credentials
                        # The password must be changed at first login.

# --- Network defaults (rendered into netplan + nftables) --------------------
WAN_IF="eth0"           # DHCP client
LAN_IF="eth1"           # static, trusted
LAN_ADDR="192.168.1.1/24"
SSH_ON_WAN="no"         # yes = allow (rate limited) SSH from the WAN side

# --- Services ---------------------------------------------------------------
# Enabled at boot.
ENABLE_SERVICES="systemd-networkd nftables ssh named chrony vnstat fail2ban irqbalance router-firstboot"
# Installed but off until you configure them.
DISABLE_SERVICES="bird openvpn strongswan router-qos apt-daily.timer apt-daily-upgrade.timer"
# Never run.
MASK_SERVICES="systemd-resolved systemd-networkd-wait-online"
