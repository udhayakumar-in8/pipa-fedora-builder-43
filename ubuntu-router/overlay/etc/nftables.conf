#!/usr/sbin/nft -f
#
# Router firewall + NAT. Reload with: systemctl reload nftables
# Extra rules: drop *.nft files into /etc/nftables.d/ (examples in /etc/router/examples/).

flush ruleset

define WAN = "@WAN_IF@"
define LAN = "@LAN_IF@"

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # ICMP / ICMPv6 (needed for PMTU discovery and IPv6 neighbor discovery)
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 100/second accept
        ip6 nexthdr icmpv6 accept

        # DHCP / DHCPv6 client replies on the WAN
        iifname $WAN udp sport 67 udp dport 68 accept
        iifname $WAN udp sport 547 udp dport 546 accept

        # LAN is trusted for router services (SSH, DNS, ...)
        iifname $LAN accept

        @SSH_WAN_RULE@
        # VPN endpoints, enable what you use:
        # iifname $WAN udp dport 51820 accept comment "WireGuard"
        # iifname $WAN udp dport 1194 accept comment "OpenVPN"
        # iifname $WAN udp dport { 500, 4500 } accept comment "IPsec IKE/NAT-T"
        # iifname $WAN meta l4proto esp accept comment "IPsec ESP"
        # BGP from a peer: ip saddr 192.0.2.1 tcp dport 179 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request } accept

        iifname $LAN oifname $WAN accept
        # VPN clients to the LAN / Internet:
        # iifname "wg0" oifname { $LAN, $WAN } accept
        # iifname "tun0" oifname { $LAN, $WAN } accept
        # Port forwards (DNAT in table ip nat) also need: ct status dnat accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        # Port forward example: iifname $WAN tcp dport 8080 dnat to 192.168.1.10:80
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN masquerade
    }
}

include "/etc/nftables.d/*.nft"
