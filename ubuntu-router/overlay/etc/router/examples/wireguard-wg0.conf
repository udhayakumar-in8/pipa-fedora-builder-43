# Example WireGuard server. Generate keys:
#   umask 077; wg genkey | tee /etc/wireguard/wg0.key | wg pubkey > /etc/wireguard/wg0.pub
# Copy to /etc/wireguard/wg0.conf, then:
#   systemctl enable --now wg-quick@wg0
# and open the port + forwarding in /etc/nftables.conf (see the commented rules).
[Interface]
Address = 10.10.0.1/24
ListenPort = 51820
PrivateKey = <contents of /etc/wireguard/wg0.key>

[Peer]
# laptop
PublicKey = <peer public key>
AllowedIPs = 10.10.0.2/32
