# Example BIRD 2 config: export connected LAN routes via OSPF and an eBGP
# session. Copy to /etc/bird/bird.conf, adapt, check with `bird -p`, then:
#   systemctl enable --now bird
router id 192.168.1.1;

log syslog all;

protocol device {}
protocol direct { ipv4; interface "eth1"; }
protocol kernel {
    ipv4 { import none; export where source != RTS_DEVICE; };
    learn;
}

protocol ospf v2 lan {
    ipv4 { import all; export where source = RTS_DEVICE; };
    area 0 {
        interface "eth1" { type broadcast; cost 10; };
    };
}

protocol bgp upstream {
    local as 65001;
    neighbor 192.0.2.1 as 65000;
    ipv4 {
        import filter { if net.len > 24 then reject; accept; };
        export where source = RTS_DEVICE;
    };
}
