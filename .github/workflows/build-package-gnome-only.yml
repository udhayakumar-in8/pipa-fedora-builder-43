name: Build Gnome-only install package

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: gnome-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v6

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo docker image prune --all --force || true
        df -h /

    - name: Build the Builder container
      run: docker build . -t 'pipa-fedora-builder-43'

    - name: Build the Gnome image
      run: docker run --privileged -v "$(pwd)"/images:/build/images -v "/dev:/dev" pipa-fedora-builder-43 gnome

    - name: Upload Gnome image
      uses: actions/upload-artifact@v4
      with:
        name: pipa-fedora-45-gnome
        path: images/*.zip
        compression-level: 0
        retention-days: 14

    - name: Split image for release if over 2 GB
      run: |
        mkdir -p release
        for f in images/*.zip; do
          if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
            split -b 1900M -d -a 2 "$f" "release/$(basename "$f")."
          else
            cp "$f" release/
          fi
        done
        ls -l release

    - name: Delete old Gnome draft releases (keep the newest one)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api "repos/${{ github.repository }}/releases" --paginate \
          --jq '[.[] | select(.draft and (.name | startswith("Fedora 45 Gnome")))] | sort_by(.created_at) | reverse | .[1:] | .[].id' |
        while read -r id; do
          echo "Deleting old draft release $id"
          gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
        done

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2.6.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: f45-gnome-${{ steps.date.outputs.date }}-${{ github.run_number }}
        name: Fedora 45 Gnome ${{ steps.date.outputs.date }}
        files: release/*
        draft: true
        body: |
          Flash with `flash.sh` (Linux/macOS) or `flash.bat` (Windows) from the unzipped folder.
          `build-report.txt` in the zip lists what was verified in this image.

          If the image is split into `.zip.00`, `.zip.01`, ... join the parts first:
          `cat *.zip.?? > image.zip` (Linux/macOS) or `copy /b file.zip.00+file.zip.01 image.zip` (Windows), then unzip.
